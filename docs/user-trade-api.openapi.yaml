openapi: 3.1.0
info:
  title: EVM Bot user HTTP trading contract — HTTP-A/B/C1/C2/C3-C
  version: 0.5.2
  description: >-
    Local Unix-domain HTTP contract, execution/submission disabled. Valid new
    POSTs create immutable rejection records by default, or explicit opt-in
    MANUAL validation-pending operation identities. Neither is a send queue.
    Optional C2 internal validation persists immutable block/hash-bound results,
    not execution admission. Optional default-off C3-C atomic admission reuses
    existing risk/authorization ledgers; it cannot grant or arm authorization.
    Admission observations never authorize execution/send. No signing, nonce
    allocation or sending is reachable.
    No client-facing dry-run step. Live execution is not implemented here.
    The A/B/C integration candidate remains pending fresh review. A wallet with
    a retained MANUAL nonce claim or signed artifact cannot admit/execute a
    second MANUAL operation in this slice, including after canonical settlement
    or revert. Historical GET/events/recovery and default-off duplicate reads
    remain available; neither an idle lane nor a confirmed balance grants reuse.
security:
  - bearerAuth: []
paths:
  /v1/trades:
    post:
      summary: Record intent with optional validation and admission; never sign or queue sending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '202':
          description: Durable MANUAL intent with optional validation/admission observations; never signing/send permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedOrder'
        '422':
          description: >-
            TTL expired/unverifiable or validation/admission rejected;
            intake/validation may already be durable. MANUAL_WALLET_REUSE_UNSUPPORTED
            specifically rejects a new admission for a wallet/address with
            retained MANUAL nonce/artifact history, even after canonical outcome.
            Default-off historical duplicates do not create an admission and do
            not receive this error merely for reading the original record.
          headers:
            Location:
              description: Durable request path when intake already succeeded; reuse original idempotency key
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                retainedManualWallet:
                  value:
                    error:
                      code: MANUAL_WALLET_REUSE_UNSUPPORTED
                      message: retained MANUAL wallet history cannot authorize another trade in this stage
        '502':
          description: Unverifiable chain observation; source/resolution may already be durable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Durable SUBMISSION_DISABLED record, or unavailable/stopped admission/API error; stop-first admission preflight takes priority over wallet-reuse rejection, including admission-enabled duplicate POSTs; committed phases remain queryable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RejectedRecord'
                  - $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/trades/by-idempotency-key:
    get:
      summary: Retrieve original request after a lost response
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Original caller-scoped intake/rejection, no new TTL or action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRecord'
        default:
          $ref: '#/components/responses/Error'
  /v1/trades/{request_id}:
    get:
      summary: Query verified intake and execution history without authorizing an action
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Caller-scoped historical observations; no RPC, new expiry, execution/send permission or authorization requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRecord'
        default:
          $ref: '#/components/responses/Error'
  /v1/trades/{request_id}/events:
    get:
      summary: Read caller-scoped durable lifecycle history, never command recovery or sending
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9223372036854775807
          description: Exclusive request-scoped cursor; use the preceding response next_cursor, not a timestamp or another request cursor
      responses:
        '200':
          description: >-
            At most 100 append-only journal events in strictly increasing
            request-scoped cursor order. MANUAL_ORDER_LIFECYCLE uses the durable
            manual_lifecycle_events journal and preserves the original intake
            sequence. API_REJECTION_ONLY remains the rejection scope. This is
            recorded history, not recovery availability or action permission.
          content:
            application/json:
              schema:
                type: object
                required: [scope, events, next_cursor]
                properties:
                  scope:
                    enum: [API_REJECTION_ONLY, MANUAL_ORDER_INTAKE_ONLY, MANUAL_ORDER_LIFECYCLE]
                    description: MANUAL_ORDER_INTAKE_ONLY describes the historical C1-only response; journal-backed MANUAL responses use MANUAL_ORDER_LIFECYCLE
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [cursor, type, reason_code, created_at]
                      properties:
                        cursor:
                          type: integer
                          minimum: 1
                          maximum: 9223372036854775807
                          description: Per-request durable order, retained across restart; not a cross-request cursor
                        type:
                          type: string
                          description: Verified durable event type; includes intake and source-bound submission/receipt/canonical/reorg lifecycle facts, not commands
                          examples: [USER_HTTP_TRADE_REJECTED, MANUAL_HTTP_ORDER_RECORDED]
                        reason_code:
                          type: string
                          description: Durable event reason, not intake-only or current execution permission
                        created_at: {type: string, format: date-time}
                  next_cursor:
                    type: integer
                    minimum: 0
                    maximum: 9223372036854775807
                    description: Last event actually returned, or unchanged input after on an empty page; never advances over unseen events
        default:
          $ref: '#/components/responses/Error'
  /v1/capabilities:
    get:
      summary: Local API limits and explicitly unconnected execution capabilities
      responses:
        '200':
          description: Not authorization or recovery health; live and send flags false
        default:
          $ref: '#/components/responses/Error'
  /v1/wallets:
    get:
      summary: Durable wallet identity in caller scope, no balances
      responses:
        '200':
          description: Caller-scoped wallet ID, chain and address; listing does not authorize reuse of a retained MANUAL wallet
        default:
          $ref: '#/components/responses/Error'
  /v1/tokens/{address}:
    get:
      summary: Read verified native-quote Pons v2 Curve token metadata, not authorization
      parameters:
        - $ref: '#/components/parameters/QueryChain'
        - name: address
          in: path
          required: true
          schema: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
      responses:
        '200':
          description: Block/hash bound metadata, route and runtime identities; send_authorized=false
        default:
          $ref: '#/components/responses/Error'
  /v1/wallets/{wallet_id}/balances:
    get:
      summary: Read caller-scoped balances and allowance-limited sellable reference
      parameters:
        - $ref: '#/components/parameters/QueryChain'
        - name: wallet_id
          in: path
          required: true
          schema: {type: string}
        - name: token
          in: query
          schema: {type: string, pattern: '^0x[a-fA-F0-9]{40}$'}
      responses:
        '200':
          description: >-
            Native balance and optional token/allowance at one block/hash;
            an unresolved lane or retained MANUAL nonce claim forces
            wallet_lane_blocked=true and sellable/unreserved token reference to
            zero, including after canonical settlement leaves the lane idle.
            available_native=null, not an execution reservation or permission.
        default:
          $ref: '#/components/responses/Error'
  /v1/fees:
    get:
      summary: Exact Gwei reference, not total gas budget or fee execution binding
      parameters:
        - $ref: '#/components/parameters/QueryChain'
      responses:
        '200':
          description: EIP1559 base/tip/max reference; priority suggestion is not block-pinned
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    QueryChain:
      name: chain
      in: query
      required: true
      schema: {const: robinhood}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^req_[a-f0-9]{64}$'
  schemas:
    Decimal:
      type: string
      maxLength: 256
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: No exponent/sign/rounding; positivity and asset precision also validated
    TradeRequest:
      type: object
      additionalProperties: false
      required: [chain, wallet_id, token, side, slippage_percent]
      properties:
        chain: {const: robinhood}
        wallet_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Configured caller-owned wallet; a retained MANUAL nonce claim or signed artifact forbids a second MANUAL admission/execution in this slice, even after canonical settlement/revert or through an address alias
        token:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        side: {enum: [buy, sell]}
        amount:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Positive native quantity for buy, token quantity for sell; excludes gas
        sell_percent:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Sell only; (0,100], at most 2 decimal places
        slippage_percent:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: At most 2 decimal places; constrained by deployment API policy
        fee:
          $ref: '#/components/schemas/Fee'
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Further constrained by API policy; omitted default binds once
        min_receive:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Optional positive user output floor, default UNSET; no execution binding yet
      oneOf:
        - required: [amount]
          not: {required: [sell_percent]}
        - required: [sell_percent]
          properties:
            side: {const: sell}
          not: {required: [amount]}
    Fee:
      type: object
      additionalProperties: false
      properties:
        max_gwei:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Positive EIP-1559 max per-gas price in Gwei, max 9 decimal places
        tip_gwei:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Priority fee included in max_gwei; zero allowed, may not exceed max
        max_total_native:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Optional positive user gas-budget ceiling, excludes trade input, default UNSET
      anyOf:
        - required: [max_gwei]
        - required: [max_total_native]
      dependentRequired:
        tip_gwei: [max_gwei]
    RejectedRecord:
      type: object
      required: [request_id, status, reason_code, progress, request, expires_at, created_at, send_authorized, submission_queued]
      properties:
        progress:
          $ref: '#/components/schemas/TradeProgress'
        request_id: {type: string}
        operation_id: {type: 'null'}
        status: {const: REJECTED}
        reason_code: {const: SUBMISSION_DISABLED}
        request:
          $ref: '#/components/schemas/TradeRequest'
        api_policy_version: {type: integer}
        api_policy_hash: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        deadline_capability: {const: APPLICATION_TTL_ONLY}
        contract_deadline: {const: false}
        send_authorized: {const: false}
        submission_queued: {const: false}
        duplicate: {type: boolean}
    TradeRecord:
      oneOf:
        - $ref: '#/components/schemas/RejectedRecord'
        - $ref: '#/components/schemas/RecordedOrder'
    RecordedOrder:
      type: object
      required: [request_id, operation_id, status, reason_code, progress, request, expires_at, created_at, send_authorized, submission_queued]
      properties:
        progress:
          $ref: '#/components/schemas/TradeProgress'
        execution:
          $ref: '#/components/schemas/ExecutionSnapshot'
        request_id: {type: string}
        operation_id: {type: string, pattern: '^manual_op_req_[a-f0-9]{64}$'}
        status: {const: RECORDED}
        reason_code:
          const: VALIDATION_NOT_CONNECTED
          description: Historical C1 intake reason; consult validation/admission overlays, never interpret this field as transaction outcome
        request:
          $ref: '#/components/schemas/TradeRequest'
        api_policy_version: {type: integer}
        api_policy_hash: {type: string}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        deadline_capability: {const: APPLICATION_TTL_ONLY}
        contract_deadline: {const: false}
        send_authorized: {const: false}
        submission_queued: {const: false}
        duplicate: {type: boolean}
        validation:
          $ref: '#/components/schemas/ManualValidation'
        admission:
          $ref: '#/components/schemas/ManualAdmission'
    TradeProgress:
      type: object
      additionalProperties: false
      required: [stage]
      description: Read-only durable milestone, not a transaction outcome or execution/send permission
      properties:
        stage:
          enum: [REJECTED, INTAKE_RECORDED, VALIDATION_RECORDED, ADMISSION_RECORDED]
    ExecutionSnapshot:
      type: object
      additionalProperties: false
      required: [operation_status, step_status]
      description: >-
        Optional read-only verified execution history on both trade GET routes
        and duplicate POST responses. These observations follow the immutable
        request/execution/nonce/artifact/first-submission identity, not the latest
        unrelated database row. Missing stages are omitted; contradictory
        provenance fails the request instead of presenting unverified success.
        A tx_hash can exist on a signed attempt before submission. Interpret
        submission, receipt and position-effect observations separately; this
        object grants no signing, sending, replay or retry permission. Reads and
        duplicates do not renew TTL or perform economic work. The progress stage
        continues to describe the intake/validation/admission milestone.
      properties:
        operation_status: {type: string}
        step_status: {type: string}
        trade_step_status: {type: string}
        attempt_status: {type: string}
        submission_state:
          type: string
          enum: [submitting, submitted, broadcast_unknown, reconciling, manual_resolution, expired_prebroadcast, known_unsent]
          description: >-
            Durable submission observation, not receipt success. broadcast_unknown
            means non-invocation/non-propagation cannot be durably proved; it is
            not evidence that sending probably occurred. known_unsent retains
            frozen ownership in this MANUAL scope. Neither state permits
            automatic resend, replacement, replay or release.
        tx_hash:
          type: string
          description: Exact signed artifact identity; presence alone does not prove send, propagation, receipt success or canonical effect
        receipt_state:
          type: string
          enum: [observed, canonical_success, canonical_revert, orphaned]
          description: >-
            observed does not imply canonicality. canonical_revert is a reverted
            receipt, not a successful trade. orphaned supersedes the earlier
            canonical observation; later re-canonicalization may change it again.
        position_effect_state:
          type: string
          enum: [active, rolled_back]
          description: >-
            Current durable effect state, independently observed from receipt
            state. rolled_back is visible after earlier application; reapplication
            returns active. This is not a permanent success or finality flag.
    ManualAdmission:
      type: object
      additionalProperties: false
      required: [status, operation_id, reservation_id, reservation_state, contract_hash, expires_at, admitted_at, execution_authorized, send_authorized]
      description: >-
        Durable admission observation, NOT execution/send permission. First
        committed POST reports ADMITTED_NOT_SIGNED_NOT_SUBMITTED; duplicates
        and all GETs report HISTORICAL_ADMISSION_NOT_PERMISSION. Intake duplicate
        does not imply budget was previously consumed. Stop/revoke/expiry do not
        erase this observation; POST with enabled admission still checks controls.
      properties:
        status: {enum: [ADMITTED_NOT_SIGNED_NOT_SUBMITTED, HISTORICAL_ADMISSION_NOT_PERMISSION]}
        operation_id: {type: string}
        reservation_id: {type: string}
        reservation_state: {enum: [reserved, frozen, committed, released]}
        contract_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        expires_at: {type: string, format: date-time}
        admitted_at: {type: string, format: date-time}
        execution_authorized: {const: false}
        send_authorized: {const: false}
    ManualValidation:
      type: object
      additionalProperties: false
      required: [status, policy_version, policy_hash, expires_at, result_hash, output, send_authorized]
      description: Historical immutable validation only, not current readiness or execution permission
      properties:
        status: {const: VALIDATED_NOT_AUTHORIZED}
        policy_version: {type: integer, minimum: 1}
        policy_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        expires_at: {type: string, format: date-time}
        result_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        send_authorized: {const: false}
        output:
          $ref: '#/components/schemas/ValidationOutput'
    IntegerUnits:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Exact integer smallest units, not a human decimal or float
    Resolution:
      type: object
      required: [token, wallet, side, amount_in, native_balance, token_balance, allowance]
      properties:
        token:
          type: object
          description: Verified native-quote Pons v2 Curve metadata and identities at the persisted block/hash
          required: [chain, address, decimals, protocol, curve, factory, runtime_code_hash, curve_runtime_code_hash, quote_asset, block, send_authorized]
          properties:
            chain: {const: robinhood}
            address: {type: string}
            name: {type: string}
            symbol: {type: string}
            decimals: {type: integer, minimum: 0, maximum: 255}
            protocol: {const: pons_v2_curve}
            curve: {type: string}
            factory: {type: string}
            runtime_code_hash: {type: string}
            curve_runtime_code_hash: {type: string}
            quote_asset: {const: native}
            send_authorized: {const: false}
            block:
              type: object
              required: [number, hash]
              properties:
                number: {type: integer, minimum: 1}
                hash: {type: string, pattern: '^0x[a-f0-9]{64}$'}
        wallet: {type: string}
        side: {enum: [buy, sell]}
        amount_in: {$ref: '#/components/schemas/IntegerUnits'}
        native_balance: {$ref: '#/components/schemas/IntegerUnits'}
        token_balance: {$ref: '#/components/schemas/IntegerUnits'}
        allowance: {$ref: '#/components/schemas/IntegerUnits'}
        min_receive_units: {$ref: '#/components/schemas/IntegerUnits'}
    ValidationOutput:
      type: object
      additionalProperties: false
      required: [resolution, quoted_out, minimum_out, quote_spent, to, from, value, data, gas_limit, gas_fee_cap, gas_tip_cap, gas_budget, return_data]
      properties:
        resolution: {$ref: '#/components/schemas/Resolution'}
        quoted_out: {$ref: '#/components/schemas/IntegerUnits'}
        minimum_out: {$ref: '#/components/schemas/IntegerUnits'}
        quote_spent: {$ref: '#/components/schemas/IntegerUnits'}
        to: {type: string}
        from: {type: string}
        value: {$ref: '#/components/schemas/IntegerUnits'}
        data: {type: string, pattern: '^0x[a-f0-9]+$'}
        gas_limit: {type: integer, minimum: 1}
        gas_fee_cap: {$ref: '#/components/schemas/IntegerUnits'}
        gas_tip_cap: {$ref: '#/components/schemas/IntegerUnits'}
        gas_budget: {$ref: '#/components/schemas/IntegerUnits'}
        return_data: {type: string, pattern: '^0x[a-f0-9]{64}$'}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
  responses:
    Error:
      description: Redacted authentication, validation, conflict or unavailable error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
